<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!window.claude){window.claude={use:async n=>n==='room'?{join:name=>new Promise((res,rej)=>{
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 let me='',peers=[],pH=[],eH={};
 const R={emit:async(t,d)=>{if(ws.readyState===1)ws.send(JSON.stringify({t:'ev',topic:t,data:d}));},
  on:(t,f)=>{(eH[t]=eH[t]||[]).push(f);return()=>{eH[t]=eH[t].filter(x=>x!==f);};},
  presence:async p=>{if(ws.readyState===1)ws.send(JSON.stringify({t:'pres',patch:p}));},
  peers:()=>peers,onPeers:f=>{pH.push(f);return()=>{pH=pH.filter(x=>x!==f);};},
  leave:async()=>{clearInterval(ka);ws.close();},connected:()=>ws.readyState===1};
 const ka=setInterval(()=>{if(ws.readyState===1)ws.send('{"t":"ping"}');},20000);
 ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:String(name)}));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}
  if(m.t==='hello'){me=m.peer;res(R);}
  else if(m.t==='full'){rej(new Error('full'));}
  else if(m.t==='peers'){peers=m.peers.map(q=>({peer:q.peer,presence:q.presence||{},isMe:q.peer===me}));pH.slice().forEach(f=>f({peers}));}
  else if(m.t==='ev'){(eH[m.topic]||[]).slice().forEach(f=>f({topic:m.topic,data:m.data,peer:m.peer,isMe:m.peer===me}));}};
 ws.onerror=()=>rej(new Error('ws'));
})}:null};}

  bots.forEach(b=>{const q=Math.hypot(b.x-p.x,b.y-p.y);if(q<d){d=q;target=b}});

   const a=Math.atan2(T.y-b.y,T.x-b.x),nx=b.x+Math.cos(a)*b.speed*dt,ny=b.y+Math.sin(a)*b.speed*dt;
   b.a=a;

 });

  bots.forEach(b=>{

 bullets=bullets.filter(b=>{const k=b.life>0&&!b.hit&&!(curMap===1&&bdead(b))&&b.x>0&&b.x<WW&&b.y>0&&b.y<HH;if(!k)scene.remove(b.m);return k;});

  if(m.isMe||!active||isHost()||!m.data)return;const d=m.data,seen={};

  for(let i=bots.length-1;i>=0;i--)if(!seen[bots[i].id]){burst(bots[i].x,bots[i].y,bots[i].col);removeBot(bots[i]);bots.splice(i,1);}
  kills=d.k;level=d.l;score=kills*10;
 });
 R.on('pvp',m=>{const d=m.data;if(curMap!==1||!active||p.dead||!d||d.to!==myId)return;p.hp-=Math.min(50,+d.d||10);hurt=.55;});

 R.onPeers(c=>{
  const ids={};

   if(q.isMe)return;const s=q.presence;ids[q.peer]=1;let r=rem[q.peer];
   if(!r){
    if(s.x===undefined)return;const cc=curMap===1?(teams[q.peer]===myTeam?pal[0]:[0xc8283a,0x842f39,0xe8364c]):pal[Object.keys(rem).length%3],ch=makeChar(cc[0],cc[1],cc[2],1.12,true),lb=labelSprite(String(s.n||'Dost'),'#ffffff');
    lb.position.set(0,64,0);ch.g.add(lb);scene.add(ch.g);
    r=rem[q.peer]={ch,team:teams[q.peer],x:s.x,y:s.y,a:0,va:0,walk:0,g:'pistol',hp:100,mv:false};toast('👥 '+(s.n||'Dost')+' qo‘shildi');
   }
   r.tx=s.x;r.ty=s.y;r.ta=s.a;r.hp=s.hp;
   if(s.g&&s.g!==r.g){r.g=s.g;r.ch.setGun(s.g);}
  });
  for(const k in rem)if(!ids[k]){scene.remove(rem[k].ch.g);delete rem[k];toast('Dost chiqib ketdi');}
 });
}

 ray.setFromCamera({x:u*2-1,y:1-v*2},camera);
 if(ray.ray.intersectPlane(aimPlane,aimPt))p.a=Math.atan2(aimPt.z-p.y,aimPt.x-p.x);
};
